# Copy selected settings into your Codex config.toml after reviewing them.
# This preset is intentionally limited to portable, team-related settings.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
# Model choices are separate; --model-preset astra opts into models.astra.toml.
approvals_reviewer = "user"

[agents]
enabled = true
# Simultaneous hard ceiling. AGENTS.example.md adds smaller per-turn and per-stage creation budgets.
max_concurrent_threads_per_session = 3

# Optional and Windows-only. Use only when your Codex runtime documents this
# stronger sandbox implementation and you understand its local security tradeoff.
# [windows]
# sandbox = "elevated"
